# Override defaults with HYPERCI_* env vars.
# Reference: config/defaults.yaml in hyperi-ci.

language: rust
project:
  status: experimental
quality:
  enabled: true
test:
  enabled: true
  coverage: true
build:
  enabled: true
  strategies:
  - native
  rust:
    features: all
    targets: []
publish:
  # Off until v0.1.0 ships (Phase 21 of supply chain plan).
  enabled: false
  target: oss
