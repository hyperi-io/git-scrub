# Project:   git-scrub
# File:      .releaserc.yaml
# Purpose:   Semantic release configuration
#
# License:   Apache-2.0 — HYPERI PTY LIMITED
# Copyright: (c) 2026 HYPERI PTY LIMITED

branches:
- main
tagFormat: v${version}
plugins:
- - '@semantic-release/commit-analyzer'
  - preset: conventionalcommits
    releaseRules:
    - breaking: true
      release: major
    - type: feat
      release: minor
    - type: fix
      release: patch
    - type: perf
      release: patch
    - type: sec
      release: patch
    - type: hotfix
      release: patch
    - type: security
      release: patch
    - type: docs
      release: false
    - type: test
      release: false
    - type: refactor
      release: false
    - type: style
      release: false
    - type: build
      release: false
    - type: ci
      release: false
    - type: chore
      release: false
    - type: deps
      release: false
    - type: revert
      release: false
    - type: wip
      release: false
    - type: cleanup
      release: false
    - type: data
      release: false
    - type: debt
      release: false
    - type: design
      release: false
    - type: infra
      release: false
    - type: meta
      release: false
    - type: ops
      release: false
    - type: review
      release: false
    - type: spike
      release: false
    - type: ui
      release: false
- '@semantic-release/release-notes-generator'
- - '@semantic-release/changelog'
  - changelogFile: CHANGELOG.md
- - '@semantic-release/exec'
  - prepareCmd: python3 packaging/scripts/stamp-version.py ${nextRelease.version}
- - '@semantic-release/git'
  - assets:
    - CHANGELOG.md
    - VERSION
    - Cargo.toml
    - Cargo.lock
    message: 'chore: version ${nextRelease.version} [skip ci]'
- - '@semantic-release/github'
  - assets:
    - path: dist/git-scrub-*-linux-amd64.tar.gz
      label: git-scrub-linux-amd64.tar.gz
    - path: dist/git-scrub-*-linux-arm64.tar.gz
      label: git-scrub-linux-arm64.tar.gz
    - path: dist/git-scrub-*-darwin-amd64.tar.gz
      label: git-scrub-darwin-amd64.tar.gz
    - path: dist/git-scrub-*-darwin-arm64.tar.gz
      label: git-scrub-darwin-arm64.tar.gz
    - path: dist/git-scrub_*_amd64.deb
      label: git-scrub-amd64.deb
    - path: dist/git-scrub_*_arm64.deb
      label: git-scrub-arm64.deb
    - path: dist/git-scrub-*.x86_64.rpm
      label: git-scrub-x86_64.rpm
    - path: dist/git-scrub-*.aarch64.rpm
      label: git-scrub-aarch64.rpm
    - path: dist/git-scrub.rb
      label: git-scrub.rb (Homebrew formula)
    - path: dist/checksums.txt
      label: checksums.txt
