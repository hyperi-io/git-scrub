# git-scrub CI — Linux / macOS / Windows matrix.
#
# Jobs:
#   - quality: rustfmt + clippy (Linux only, single-OS is fine for lint).
#   - test:    cargo nextest run on all three platforms.
#   - deny:    license + advisory check (Linux only).

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # E2e tests use this fixture repo. Forks can override by setting the
  # secret/variable in their own CI; unset means tests skip honestly.
  GIT_SCRUB_TEST_REPO: https://github.com/hyperi-io/git-scrub-test

jobs:
  quality:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Doc build (no broken intra-doc links)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features

  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Configure git for tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          git config --global user.name  "ci"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - name: Configure git for tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global user.name  "ci"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - name: Build
        run: cargo build --all-features --all-targets

      - name: Test
        run: cargo nextest run --all-features

      - name: Doctests
        run: cargo test --doc --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features
