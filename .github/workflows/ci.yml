# git-scrub CI — Linux / macOS / Windows matrix.
#
# Jobs:
#   - quality: rustfmt + clippy (Linux only, single-OS is fine for lint).
#   - test:    cargo nextest run on all three platforms.
#   - deny:    license + advisory check (Linux only).

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Doc build (no broken intra-doc links)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features

  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Configure git for tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          git config --global user.name  "ci"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - name: Configure git for tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global user.name  "ci"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main

      - name: Build
        run: cargo build --all-features --all-targets

      - name: Test
        run: cargo nextest run --all-features

      - name: Doctests
        run: cargo test --doc --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
