#  Project:      git-scrub
#  File:         Cargo.toml
#  Purpose:      Workspace root + git-scrub binary/library manifest
#  Language:     Rust
#
#  License:      Apache-2.0
#  Copyright:    (c) 2026 HYPERI PTY LIMITED

[workspace]
members = [".", "tools/refresh-advisories"]
resolver = "3"

[package]
name = "git-scrub"
version = "1.0.3"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
description = "Surgical removal of unwanted content from git history: AI tool residue (artefact files + attribution trailers) and accidental data spill."
homepage = "https://github.com/hyperi-io/git-scrub"
repository = "https://github.com/hyperi-io/git-scrub"
readme = "README.md"
keywords = ["git", "history", "rewrite", "ai", "incident"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "git-scrub"
path = "src/main.rs"

[lib]
name = "git_scrub"
path = "src/lib.rs"

# Deliberately minimal deps for a small, focused CLI tool.
# No hyperi-rustlib — git-scrub stands alone.
[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
regex = "1.11"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tempfile = "3.13"
directories = "6.0"
globset = "0.4"
memchr = "2"
toml = "1.1"
semver = "1.0"

[dev-dependencies]
tempfile = "3.13"

[profile.release]
# Smaller binary for distribution. Re-evaluate when actual runtime
# performance matters for the rewrite path.
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
