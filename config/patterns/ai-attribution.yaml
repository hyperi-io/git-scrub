# git-scrub — AI attribution patterns
#
# Each pattern is a regex tested against a commit-message line. Matching
# lines are removed. After removal, the cleanup section is applied
# (collapse blank-line runs, strip trailing whitespace).
#
# All bundled patterns use the (?i) case-insensitive flag. This covers
# the GitHub-default "Co-Authored-By:" capitalisation, lowercase
# "co-authored-by:", and any other mixed-case variant an AI tool might emit.
#
# This file is config-driven on purpose: AI tools change their
# attribution signatures often, and operators need to override or extend
# the default set without recompiling.

trailers:
  claude:
    - '(?i)^Co-Authored-By:\s*Claude\s*<noreply@anthropic\.com>\s*$'
    - '(?i)^Co-Authored-By:\s*Claude\s+(Opus|Sonnet|Haiku)\s+[\d.]+.*$'
  copilot:
    - '(?i)^Co-Authored-By:\s*Copilot\s*<copilot@github\.com>\s*$'
    - '(?i)^Co-Authored-By:\s*GitHub Copilot.*$'
  cursor:
    - '(?i)^Co-Authored-By:\s*Cursor\s*<cursoragent@cursor\.com>\s*$'
    - '(?i)^Co-Authored-By:\s*Cursor\s*<noreply@cursor\.com>\s*$'
    - '(?i)^Made-with:\s*Cursor\s*$'
  codex:
    - '(?i)^Co-Authored-By:\s*Codex\b.*$'
    - '(?i)^Co-Authored-By:\s*OpenAI Codex\b.*$'
  aider:
    - '(?i)^Co-Authored-By:\s*aider\b.*$'
  gemini:
    - '(?i)^Co-Authored-By:\s*Gemini\b.*$'
    - '(?i)^Co-Authored-By:\s*Google Gemini\b.*$'
  windsurf:
    - '(?i)^Co-Authored-By:\s*Windsurf\b.*$'

footers:
  claude:
    - '^🤖 Generated with \[Claude Code\]\(https://claude\.com/claude-code\)\s*$'
    - '(?i)^Generated with Claude Code\s*$'
  cursor:
    - '(?i)^Generated with Cursor\b.*$'
  copilot:
    - '(?i)^Generated with GitHub Copilot\b.*$'
  gemini:
    - '(?i)^Generated with Gemini\b.*$'

cleanup:
  collapse_blank_runs: true
  strip_trailing_whitespace: true
