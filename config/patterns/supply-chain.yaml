# config/patterns/supply-chain.yaml
#
# Bundled supply-chain advisory snapshot for git-scrub.
#
# Supported ecosystems (v1): cargo, npm, pnpm, yarn (classic v1),
# bun (text lockfile bun.lock; binary bun.lockb is not supported),
# uv, pip (Pipfile.lock), poetry, go (go.sum), composer.
#
# This file is regenerated by `cargo run -p refresh-advisories`. Do not
# hand-edit during refresh cycles. Operators override via `--config`.
generated_at: "2026-05-19T00:00:00Z"
sources:
  - "https://github.com/rustsec/advisory-db"
  - "https://github.com/github/advisory-database"
  - "https://osv.dev"
  - "https://github.com/pypa/advisory-database"

# Initial seed entry — replaced by the refresh script's full output.
# Until the script runs, only this seed ships.
compromised: []

lockfiles:
  cargo:    ["Cargo.lock"]
  npm:      ["package-lock.json", "npm-shrinkwrap.json"]
  pnpm:     ["pnpm-lock.yaml"]
  yarn:     ["yarn.lock"]
  bun:      ["bun.lock"]
  uv:       ["uv.lock"]
  pip:      ["Pipfile.lock"]
  poetry:   ["poetry.lock"]
  go:       ["go.sum"]
  composer: ["composer.lock"]

vendored_paths:
  cargo:    ["vendor/{name}/"]
  npm:      ["node_modules/{name}/", "node_modules/@*/{name}/"]
  pnpm:     ["node_modules/.pnpm/{name}@*/node_modules/{name}/"]
  yarn:     ["node_modules/{name}/", ".yarn/cache/{name}-*"]
  bun:      ["node_modules/{name}/"]
  uv:       []
  pip:      []
  poetry:   []
  go:       ["vendor/{name}/", "vendor/*/{name}/"]
  composer: ["vendor/*/{name}/"]
